{% load static %}

<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="auth-container">
        <h1>Login</h1>

        <!-- Traditional login form -->
        <form id="login-form" onsubmit="login(event)">
            <input type="email" id="email" placeholder="Email" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>

        <hr>

        <!-- Google login button -->
        <button onclick="googleLogin()" style="background-color: #4285F4; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 16px;">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo" style="width:20px; vertical-align:middle; margin-right:10px;">
            Login with Google
        </button>

        <p>Don't have an account? <a href="/signup/">Sign up</a></p>
    </div>

    <script>
        function login(event) {
            event.preventDefault();
            // You can add your email/password login logic here
            alert("Login with email/password not implemented in this template.");
        }

        function googleLogin() {
            const redirectUri = "http://localhost:8000/auth/google/callback/";
            const clientId = "{{ google_client_id }}"; // Replace with your actual client ID if not passed from context
            const scope = "openid email profile";
            const responseType = "code";
            const state = "secure_random_state"; // Ideally use a real random CSRF token

            const url = `https://accounts.google.com/o/oauth2/v2/auth?` +
                        `client_id=${clientId}&` +
                        `redirect_uri=${redirectUri}&` +
                        `response_type=${responseType}&` +
                        `scope=${scope}&` +
                        `state=${state}`;

            window.location.href = url;
        }
    </script>
</body>
</html>
